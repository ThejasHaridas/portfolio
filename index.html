<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thejas Haridas — Portfolio</title>
<meta name="description" content="Portfolio of Thejas Haridas, AI and NLP engineer — presented as a Windows XP desktop.">
<meta name="color-scheme" content="light">
<meta property="og:title" content="Thejas Haridas — Portfolio">
<meta property="og:description" content="AI / NLP engineer. A portfolio that boots like Windows XP.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='2' fill='%230058e6'/><path d='M3 5.2 7.2 4.6v3.1H3zm5 -0.7L13 3.8v3.9H8zM3 8.6h4.2v3.1L3 11.1zm5 0h5v3.9l-5-.7z' fill='%23fff'/></svg>">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/window.css">
<link rel="stylesheet" href="styles/taskbar.css">
<link rel="stylesheet" href="styles/apps.css">
</head>
<body>

<!-- ============ BOOT ============ -->
<div id="boot" class="boot-screen">
  <div class="boot-inner">
    <div class="boot-logo">
      <div class="xp-flag xp-flag--lg" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="boot-wordmark">
        <span class="boot-micro">Thejas Haridas</span>
        <span class="boot-brand">Portfolio<span class="boot-xp">XP</span></span>
      </div>
    </div>
    <div class="boot-bar" role="progressbar" aria-label="Starting up"><div class="boot-bar-track"><i></i><i></i><i></i></div></div>
    <div class="boot-footer">Loading your desktop&hellip;</div>
  </div>
</div>

<!-- ============ LOGIN ============ -->
<div id="login" class="login-screen" hidden>
  <div class="login-top"></div>
  <div class="login-main">
    <div class="login-left">
      <div class="xp-flag xp-flag--lg" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="login-brand">Portfolio<span>XP</span></div>
      <p class="login-hint">To begin, click your user name</p>
    </div>
    <div class="login-divider" role="presentation"></div>
    <div class="login-right">
      <button class="user-tile" id="userTile" type="button">
        <span class="user-pic" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="48" height="48"><circle cx="24" cy="17" r="9" fill="#ffd9a0"/><path d="M6 46c0-10 8-16 18-16s18 6 18 16z" fill="#4a9fd5"/><path d="M15 12a9 9 0 0 1 18 0c0 2-1 3-2 3H17c-1 0-2-1-2-3z" fill="#5a3a22"/></svg>
        </span>
        <span class="user-meta">
          <strong>Thejas Haridas</strong>
          <em>Click here to log on</em>
        </span>
      </button>
    </div>
  </div>
  <div class="login-bottom">
    <p>After you log on, you can explore the desktop, open the folders and read about my work.</p>
  </div>
</div>

<!-- ============ DESKTOP ============ -->
<div id="desktop" class="desktop" hidden>
  <div class="wallpaper" aria-hidden="true">
    <div class="wp-sky"></div>
    <div class="wp-clouds"></div>
    <div class="wp-hill wp-hill--far"></div>
    <div class="wp-hill wp-hill--mid"></div>
    <div class="wp-hill wp-hill--near"></div>
  </div>

  <ul id="iconLayer" class="icon-layer" role="listbox" aria-label="Desktop icons"></ul>

  <div id="windowLayer" class="window-layer"></div>

  <div id="desktopMenu" class="ctx-menu" hidden role="menu">
    <button role="menuitem" data-ctx="arrange">Arrange Icons By <span class="ctx-arrow">&#9656;</span></button>
    <button role="menuitem" data-ctx="refresh">Refresh</button>
    <hr>
    <button role="menuitem" data-ctx="paste" disabled>Paste</button>
    <button role="menuitem" data-ctx="new" disabled>New <span class="ctx-arrow">&#9656;</span></button>
    <hr>
    <button role="menuitem" data-ctx="properties">Properties</button>
  </div>
</div>

<!-- ============ TASKBAR ============ -->
<div id="taskbar" class="taskbar" hidden>
  <button id="startBtn" class="start-btn" type="button" aria-haspopup="menu" aria-expanded="false">
    <span class="xp-flag" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    <span class="start-word">start</span>
  </button>
  <div class="quick-launch" aria-label="Quick launch">
    <button class="ql-btn" data-open="about" title="About Me" type="button">&#128100;</button>
    <button class="ql-btn" data-open="projects" title="My Projects" type="button">&#128193;</button>
    <button class="ql-btn" data-open="contact" title="Contact" type="button">&#9993;</button>
  </div>
  <div id="taskButtons" class="task-buttons"></div>
  <div class="tray">
    <button class="tray-icon" id="trayVolume" title="Volume" type="button">&#128266;</button>
    <span class="tray-icon" title="Network">&#128187;</span>
    <span class="tray-clock" id="clock" title=""></span>
  </div>
</div>

<!-- ============ START MENU ============ -->
<div id="startMenu" class="start-menu" hidden role="menu">
  <header class="sm-header">
    <span class="sm-avatar" aria-hidden="true">
      <svg viewBox="0 0 40 40" width="40" height="40"><circle cx="20" cy="14" r="7.5" fill="#ffd9a0"/><path d="M5 39c0-8.3 6.7-13 15-13s15 4.7 15 13z" fill="#4a9fd5"/><path d="M12.5 10a7.5 7.5 0 0 1 15 0c0 1.7-.8 2.5-1.7 2.5H14.2c-.9 0-1.7-.8-1.7-2.5z" fill="#5a3a22"/></svg>
    </span>
    <strong>Thejas Haridas</strong>
  </header>
  <div class="sm-body">
    <div class="sm-col sm-col--left" id="smLeft"></div>
    <div class="sm-col sm-col--right" id="smRight"></div>
  </div>
  <footer class="sm-footer">
    <button class="sm-power" data-action="logoff" type="button"><span aria-hidden="true">&#128274;</span> Log Off</button>
    <button class="sm-power" data-action="shutdown" type="button"><span aria-hidden="true">&#9211;</span> Turn Off Computer</button>
  </footer>
</div>

<!-- ============ SHUTDOWN ============ -->
<div id="shutdown" class="shutdown-screen" hidden>
  <div class="shutdown-card">
    <div class="xp-flag xp-flag--lg" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <p class="shutdown-msg">It is now safe to close this tab.</p>
    <button class="xp-btn" id="rebootBtn" type="button">Turn back on</button>
  </div>
</div>

<script src="scripts/data.js"></script>
<script src="scripts/wm.js"></script>
<script src="scripts/apps.js"></script>
<script src="scripts/minesweeper.js"></script>
<script src="scripts/main.js"></script>
</body>
</html>
